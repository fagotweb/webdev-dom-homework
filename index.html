<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments"></ul>
    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea type="textarea" class="add-form-text" placeholder="Введите ваш коментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";
  // Код писать здесь
  const commentsEl = document.querySelector('.comments'); 
  const likesCounterEl = document.querySelector('.likes-counter');
  const addFormNameEl = document.querySelector('.add-form-name');
  const addFormTextEl = document.querySelector('.add-form-text');
  const buttonEl = document.querySelector('.add-form-button');
  const likeButtonEl = document.querySelector('.like-button');
  
  addFormNameEl.addEventListener('click', () => {
    addFormNameEl.style.backgroundColor = 'white';
  })

  addFormTextEl.addEventListener('click', () => {
    addFormTextEl.style.backgroundColor = 'white';
  })

  const comments = [
    { name: "Глеб Фокин", comment: "Это будет первый комментарий на этой странице", data: "12.02.22 12:18", like: 3, class: "like-button" },    
    { name: "Варвара Н.", comment: "Мне нравится как оформлена эта страница! ❤", data: "12.02.22 12:18", like: 75, class: "like-button" }
  ]

  const likesListeners = () => {
    const likeButtonElements = document.querySelectorAll('.like-button');

    for (const likeButtonEl of likeButtonElements) {
      likeButtonEl.addEventListener("click", () => {
        const index = likeButtonEl.dataset.index;
        if (comments[index].class === "like-button" ) {
          comments[index].class = "like-button -active-like";
          comments[index].like = comments[index].like+1;
        } else {
          comments[index].class = "like-button";
          comments[index].like = comments[index].like-1;
        }        
        renderComments();
      });
    }
  };

  const renderComments = () => {
    const commentsHtml = comments.map((comments, index) => {
      const Html = commentsEl.innerHTML;
      return `<li class="comment"><div class="comment-header"><div class="name">"${comments.name}"</div><div class="date">"${comments.data}"</div></div><div class="comment-body"><div class="comment-text">"${comments.comment}"</div></div><div class="comment-footer"><div class="likes"><span data-index="${index}" class="likes-counter">"${comments.like}"</span><button data-index="${index}" class="${comments.class}"></button></div></div></li>`
    }).join("");
    commentsEl.innerHTML = commentsHtml;
    likesListeners();
  }

  renderComments();

  buttonEl.addEventListener("click", () => {
    comments.name = addFormNameEl.value;
    if (addFormNameEl.value === "") {
      addFormNameEl.style.backgroundColor = 'red';
      return;
    };

    comments.comment = addFormTextEl.value;
    if (addFormTextEl.value === "") {
      addFormTextEl.style.backgroundColor = 'red';
      return;
    };

    let now = new Date();
    let dateStr = `${String(now.getDate()).padStart(2, '0')}.${String(now.getMonth() + 1).padStart(2, '0')}.${now.toLocaleString('default', { year: '2-digit' })}   ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    comments.data = dateStr;

    const newComments = { name: addFormNameEl.value, comment: addFormTextEl.value, data: dateStr, like: 0, class: "like-button" }
    comments.push(newComments);
    addFormNameEl.value = "";
    addFormTextEl.value = "";
    renderComments();
  })

  console.log("It works!");
</script>

</html>
